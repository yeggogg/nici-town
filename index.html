<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NICI 独角兽养成 · 魔法小镇</title>
<style>
/* 手机上快速连点按钮会被识别成"双击缩放"，整个界面被放大。
   touch-action:manipulation 关掉双击缩放，但**保留双指缩放**
   （不像 user-scalable=no 那样把无障碍功能一起砍掉）。 */
html{touch-action:manipulation}
:root{
  --ink:#4a3b5c;
  --ink-soft:#8a7a9e;
  --card:#ffffff;
  --line:rgba(120,95,150,.14);
  --shadow:0 10px 30px rgba(120,95,160,.13), 0 2px 6px rgba(120,95,160,.07);
  --pink:#ff7fb2;
  --leaf:#5fc48b;
  --sky1:#dff0ff; --sky2:#ffeaf4; --sky3:#eae3ff;
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"Segoe UI Variable Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 15% -10%, #fff6fb 0%, transparent 60%),
    radial-gradient(1000px 600px at 90% 0%, #eaf6ff 0%, transparent 55%),
    linear-gradient(170deg,var(--sky1) 0%, var(--sky2) 48%, var(--sky3) 100%);
  background-attachment:fixed;
  min-height:100%;
  overflow-x:hidden;
  user-select:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.7) 0 60px, transparent 61px),
    radial-gradient(circle at 78% 18%, rgba(255,255,255,.55) 0 44px, transparent 45px),
    radial-gradient(circle at 60% 72%, rgba(255,255,255,.5) 0 70px, transparent 71px);
  filter:blur(2px);
  opacity:.7;
}

/* ============ 布局 ============ */
.wrap{
  position:relative;z-index:1;
  max-width:520px;margin:0 auto;
  padding:14px 14px calc(22px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  min-height:100vh;
}

/* ============ 顶栏 ============ */
.topbar{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:var(--radius);
  padding:10px 14px;
  box-shadow:var(--shadow);
}
/* 官方 logo（NICI 官网 images/logo_2x.png 原文件，160x56 RGBA）。
   之前是用字体+圆点模仿的，现在换成真素材。 */
.logo{
  display:block;flex:0 0 auto;
  height:22px;width:auto;
  /* 高分辨率屏下边缘更锐利 */
  image-rendering:-webkit-optimize-contrast;
}
.topbar .title{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.3px}
.topbar .spacer{flex:1}
.chip{
  font-size:12px;font-weight:700;
  background:linear-gradient(180deg,#fff,#f6efff);
  border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;color:var(--ink);
  white-space:nowrap;
}
.chip.sun{color:#e8930c;border-color:rgba(255,190,60,.35);background:linear-gradient(180deg,#fffdf3,#fff3d6)}
.iconbtn{
  width:34px;height:34px;flex:0 0 auto;
  display:grid;place-items:center;
  border:1px solid var(--line);background:#fff;border-radius:12px;
  font-size:16px;cursor:pointer;color:var(--ink);
  transition:transform .15s, box-shadow .15s;
}
.iconbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(120,95,160,.16)}
.iconbtn:active{transform:scale(.94)}
/* 顶栏图标换成生成的插画。用 img 而不是背景图，
   这样加载失败时 onerror 还能退回 emoji 兜底。 */
.iconbtn .ico{width:22px;height:22px;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 1px 2px rgba(120,95,160,.22))}
/* 兜底尺寸：任何 .ico 默认都按行内小图标渲染。
   不写这条的话，某个容器忘了单独定义尺寸时，
   图标会按原图（近千像素）撑满整个面板 —— 这个坑踩过一次。 */
.ico{width:17px;height:17px;object-fit:contain;pointer-events:none;
  vertical-align:-3px;filter:drop-shadow(0 1px 2px rgba(120,95,160,.2))}
/* 数值条标签前的小图标 */
.meter .lb .ico{width:17px;height:17px;vertical-align:-3px;margin-right:3px}
/* 动作按钮的图标 */
.btn .ico{width:30px;height:30px;vertical-align:baseline;margin:0;
  filter:drop-shadow(0 2px 3px rgba(120,95,160,.2))}
/* 田里有草熟了：按钮冒个小绿点，不用打开也知道该去收了 */
.iconbtn.hasRipe{position:relative;border-color:#8fd9a8;animation:ripePulse 1.8s ease-in-out infinite}
.iconbtn.hasRipe::after{
  content:'';position:absolute;top:-3px;right:-3px;
  width:10px;height:10px;border-radius:50%;
  background:#5fc48b;border:2px solid #fff;
  box-shadow:0 1px 4px rgba(60,150,100,.5);
}

/* ============ 田地入口（草地上的一块小木牌）============
   位置：草地右上角、靠近地平线（远山与草地的交界约在 52% 处）。
   尺寸刻意做小 —— 它是路边的一块指示牌，不是 UI 按钮。
   加大点击热区靠 padding，不靠放大图形。*/
.fieldgate{
  position:absolute;right:5%;top:49%;z-index:4;
  width:13.5%;max-width:70px;
  padding:10px 8px 8px;            /* 透明热区，比图形大一圈，手机上好点 */
  margin:-10px -8px -8px;          /* 抵消 padding，视觉位置不受影响 */
  border:none;background:none;cursor:pointer;
  font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:0;
  -webkit-tap-highlight-color:transparent;
  /* 只在 filter 上做反馈，**不动几何** —— 否则会抖动 */
  transition:filter .18s;
}
.fieldgate:hover{filter:brightness(1.08) saturate(1.05)}
.fieldgate:active{filter:brightness(.93)}
.fieldgate .gateArt{
  width:100%;height:auto;display:block;pointer-events:none;
  /* 投影跟着木牌走，方向朝右下 —— 和场景里左上方来的阳光一致，
     这样才不像是"贴上去的" */
  filter:drop-shadow(2px 4px 5px rgba(45,65,38,.42));
}
/* 木牌脚下的一小片阴影，把它"钉"在草地上。
   没有这个会显得木牌浮在画面之上。*/
.fieldgate::before{
  content:'';position:absolute;
  left:50%;bottom:14%;translate:-50% 0;
  width:54%;height:7px;border-radius:50%;
  background:radial-gradient(ellipse, rgba(40,70,35,.38), transparent 72%);
  pointer-events:none;
}
/* 木牌下方的文字：极简，一行小字 */
.fieldgate .gateLabel{
  margin-top:-2px;
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;
}
.fieldgate .gateLabel b{
  font-size:9.5px;font-weight:900;color:#fff;letter-spacing:.3px;
  text-shadow:0 1px 3px rgba(30,45,25,.9), 0 0 6px rgba(30,45,25,.6);
  line-height:1.2;
}
.fieldgate .gateLabel i{
  font-size:8px;font-weight:700;font-style:normal;
  color:rgba(255,255,255,.95);line-height:1.2;
  text-shadow:0 1px 3px rgba(30,45,25,.9), 0 0 6px rgba(30,45,25,.6);
}
/* 有草熟了：木牌上方冒一颗会跳的小圆点 */
.fieldgate .gateRipe{
  position:absolute;top:-2%;right:6%;
  width:13px;height:13px;border-radius:50%;
  background:#5fc48b;border:2px solid #fff;
  box-shadow:0 2px 7px rgba(50,180,110,.65);
  display:none;
}
.fieldgate.hasRipe .gateRipe{display:block;animation:gateBob 1.2s ease-in-out infinite}
@keyframes gateBob{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-4px) scale(1.12)}
}
/* 悬停时木牌下方泛一点暖光，示意"可以走过去" */
.fieldgate .gateGlow{
  position:absolute;left:50%;bottom:2%;translate:-50% 0;
  width:88%;height:38%;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse, rgba(255,246,205,.5), transparent 70%);
  opacity:0;transition:opacity .18s;
}
.fieldgate:hover .gateGlow{opacity:1}

/* ============ 舞台 ============ */
.stage{
  position:relative;
  border-radius:28px;
  overflow:hidden;
  /* 场景图铺满，渐变只作为图片未加载完时的兜底 */
  background:linear-gradient(180deg,#bfe4ff 0%,#e8f4ff 45%,#cdeeb0 45.2%,#a8dd8c 100%) center bottom / cover no-repeat;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow);
  min-height:clamp(292px,44vh,352px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  padding-bottom:8px;
}
.stage.has-scene{
  background-image:url("assets/opt/scene_meadow.webp");
  background-position:center bottom;
  background-size:cover;
  background-repeat:no-repeat;
}
/* 田地是一个**场景**，不是弹窗 —— 进田地就是换一张背景图，
   独角兽那一层隐藏，换成田地格子。这样才有"走过去种地"的感觉。 */
/* 田地场景要比牧场高一些 —— 背景图是带远山天空的横幅构图，
   舞台太矮会被 cover 裁得只剩中间一条土垄。
   这里只在田地场景拉高，牧场维持原尺寸（不然独角兽会显得太小）。*/
/* 田地场景。
   注意：这里**不再用 CSS background**，改成一张独立的 <img> 图层。
   原因：background-size:cover 会把图裁掉两侧，而田垄坐标是
   图片自身百分比。用 CSS 背景的话，两张坐标系对不上，作物会错位。
   现在由 layoutFieldScene() 按 cover 规则算出精确尺寸写到图层上，
   田垄坐标就与图片严格 1:1。 */
.stage[data-scene="field"]{
  background:linear-gradient(180deg,#8fc9e8,#bfe0a8);
  min-height:clamp(330px, 52vh, 430px);
}
.stage[data-scene="field"] #stable,
.stage[data-scene="field"] .eff,
.stage[data-scene="field"] .mood,
/* 进了田地就把入口木牌藏起来 —— 否则它会浮在田垄上挡住作物，
   而且已经在地里了，再显示"去小田地"也没意义。 */
.stage[data-scene="field"] .fieldgate{display:none}
.fieldview{
  position:absolute;inset:0;z-index:3;
  display:none;
}
.stage[data-scene="field"] .fieldview{display:block}

/* 场景图层：尺寸和位置由 JS 按 cover 算出，与舞台精确贴合 */
.fieldscene{
  position:absolute;
  left:0;top:0;
  overflow:visible;
}
.fieldscene .bg{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}
/* 四块田垄。
   位置**不是均分网格**，而是从背景图上按土色分割量出来的真实梯形
   （见 tools/find_beds.py 的产出）。背景里的田垄是透视图 ——
   上窄下宽、左右向外倾斜，用 2×2 网格去对永远对不上，
   那正是"一个框硬盖在画上"的违和感来源。

   现在**没有框**：每块地就是一个透明的梯形热区，
   作物直接长在画好的土面上，看上去就是地里的东西。*/
.fieldplots{position:absolute;inset:0}

/* 单块地。left/top/width/height 由 JS 按量出的四边形算包围盒，
   真正的形状用 clip-path 裁成梯形 —— 这样点击和悬停都只落在土面上。 */
.bed{
  position:absolute;
  display:grid;place-items:center;
  cursor:pointer;border:none;background:none;padding:0;
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
  /* 给内部的绝对定位元素（作物、标签）当参照系 */
  isolation:isolate;
  /* hover 时**绝对不能**加 translate / scale / top 变化：
     元素一动，指针就可能落到它外面 -> mouseleave -> 复位 ->
     指针又进去 -> 无限抖动，根本点不中。 */
  transition:filter .16s;
}
.bed:hover{filter:brightness(1.12) saturate(1.08)}
.bed:active{filter:brightness(.92)}

/* 悬停时土面泛一层暖光，提示"这块能点" —— 比画边框自然得多 */
.bedglow{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 58%,
             rgba(255,244,205,.6), rgba(255,238,180,.2) 52%, transparent 76%);
  opacity:0;transition:opacity .18s;
}
.bed:hover .bedglow{opacity:1}

/* 作物：**不放在 .bed 里面**，而是单独定位在场景坐标上。
   两个原因：
     1. .bed 用 clip-path 裁成梯形，作物放进去会被裁掉一截
        —— 这就是"长大之后超出显示框"的来源。
     2. 作物要落在田垄中间，且大小随地块尺寸走，
        放在热区里没法独立控制。

   宽高由 JS 按地块尺寸写进 --cw / --ch（见 bedGround）。
   不写这两个变量，作物在手机上会小到看不清。*/
.crop{
  position:absolute;
  bottom:var(--ground, 50%);
  translate:-50% 0;            /* 水平居中到那一块地的中线 */
  height:var(--ch, 16%);
  width:var(--cw, 12%);
  object-fit:contain;
  transform-origin:50% 92%;    /* 以根部为基准长大 */
  filter:drop-shadow(0 4px 7px rgba(28,18,8,.5));
  pointer-events:none;
  transition:transform .55s ease-out;
}
.crop.pem{
  width:auto;height:auto;
  font-size:26px;line-height:1;
  translate:-50% -45%;
  filter:drop-shadow(0 2px 5px rgba(30,20,10,.5));
}

/* 空地：土面上一个淡白色的 "+"，平时也隐约可见 ——
   完全隐藏的话玩家不知道这块地能点。悬停时变亮。 */
.bed .plus{
  position:relative;
  font-size:26px;font-weight:300;line-height:1;
  color:rgba(255,248,228,.95);
  text-shadow:0 2px 8px rgba(40,25,10,.85), 0 0 16px rgba(255,240,200,.4);
  opacity:.5;transition:opacity .18s;
  pointer-events:none;
}
.bed:hover .plus{opacity:1}

/* 地块下方的小标签。
   独立成层（不是 .bed 的子元素），因为要按**行**统一对齐 ——
   嵌在地块里的话，只能落在各自地块的底边，而地块高度有细微差异，
   叠起来就歪了。横向位置由 JS 按地块中线写死，纵向按行底边写死。*/
.tag{
  position:absolute;
  translate:-50% 0;
  padding:3px 9px;border-radius:999px;white-space:nowrap;
  font-size:10px;font-weight:900;color:#fff;
  background:rgba(34,44,30,.72);
  border:1px solid rgba(255,255,255,.3);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  text-shadow:0 1px 2px rgba(0,0,0,.5);
  opacity:0;transition:opacity .18s;
  pointer-events:none;
  z-index:5;
}
/* 成熟 / 生长中要常驻显示 —— 手机上根本没有 hover，
   靠 hover 才显示的标签等于永远看不见。*/
.tag.on{opacity:1}
.tag.on.ripe{
  background:rgba(38,124,74,.92);
  border-color:rgba(190,255,215,.7);
  animation:tipPulse 1.5s ease-in-out infinite;
}
@keyframes tipPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* 桌面上悬停某块地时，只点亮它自己那个标签（由 JS 打 .on）。
   CSS 的 ~ 兄弟选择器做不到"只对应一个"，会把所有标签都点亮。*/

/* 熟了：作物轻轻上下浮动 + 一圈暖绿光，不画框也一眼看得出 */
.bed .crop.ripe{animation:ripeBounce 1.6s ease-in-out infinite}
@keyframes ripeBounce{
  0%,100%{transform:scale(1) translateY(0)}
  46%{transform:scale(1.05) translateY(-6px)}
}
.bed.ripe .bedglow{
  opacity:.85;
  background:radial-gradient(ellipse at 50% 58%,
             rgba(170,255,200,.7), rgba(140,240,180,.24) 54%, transparent 78%);
  animation:ripeGlow 1.7s ease-in-out infinite;
}
@keyframes ripeGlow{0%,100%{opacity:.5}50%{opacity:1}}

/* 返回牧场 */
.fieldback{
  position:absolute;top:10px;left:12px;z-index:5;
  display:flex;align-items:center;gap:5px;
  padding:7px 13px;border-radius:999px;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:900;color:#fff;
  background:rgba(30,40,30,.42);border:1px solid rgba(255,255,255,.4);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:background .15s;
}
.fieldback:hover{background:rgba(30,40,30,.6)}
.fieldhint{
  position:absolute;top:12px;right:12px;z-index:5;
  font-size:11px;font-weight:800;color:#fff;
  padding:6px 12px;border-radius:999px;
  background:rgba(30,40,30,.42);border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  text-shadow:0 1px 2px rgba(0,0,0,.4);
}

/* 场景图的上下渐晕：顶部压一点保证 HUD 文字可读，底部让脚部落进草里不显生硬 */
.stage::before,
.stage::after{
  content:"";position:absolute;left:0;right:0;z-index:1;pointer-events:none;
}
.stage::before{top:0;height:34%;
  background:linear-gradient(180deg,rgba(28,44,72,.30),rgba(28,44,72,.10) 55%,transparent)}
.stage::after{bottom:0;height:30%;
  background:linear-gradient(0deg,rgba(38,62,30,.34),rgba(38,62,30,.10) 55%,transparent)}

/* #stable 铺满舞台，独角兽按舞台高度定尺寸 —— 用绝对定位而非 flex，
   这样立绘大小只跟舞台高矮有关，不会被自身宽度撑破背景。*/
#stable{position:absolute;inset:0;z-index:2;pointer-events:none}

/* 独角兽 */
/* 三层各管一件事，避免 transform 互相覆盖：
   .uni-wrap 只管站位（left 由 JS 逐帧改，横向走动）
   .uni      只管姿态（一条 transform 字符串，全部由 JS 合成）*/
.uni-wrap{
  position:absolute;left:50%;bottom:15%;height:66%;
  translate:-50% 0;                 /* 居中对齐到 left 指定的位置 */
  pointer-events:none;
  will-change:left;
}
/* 生成的立绘是位图，用 img 呈现；filter 投出柔和落地阴影，让它"站"在草地上 */
.uni-img{
  display:block;height:100%;width:auto;
  filter:drop-shadow(0 6px 9px rgba(60,80,50,.28))
         drop-shadow(0 1px 3px rgba(60,80,50,.16));
  pointer-events:none;
}
/* 呼吸/迈步/弹跳/摇晃全部合成到这一条 transform 上，见 updateUni()。
   这里不再挂 CSS 动画 —— 否则会盖掉 JS 写的 transform。*/
.uni{
  transform-origin:50% 100%;        /* 以脚为轴，动起来才不会飘离地面 */
  will-change:transform;
}
@media(prefers-reduced-motion:reduce){
  .uni{transition:none}
}

/* 精灵：飘字 / 小心心 */
.floaties{position:absolute;inset:0;pointer-events:none;overflow:visible}
.floaty{
  position:absolute;font-weight:900;font-size:17px;
  text-shadow:0 2px 6px rgba(255,255,255,.95), 0 0 10px rgba(255,255,255,.85);
  animation:floatUp 1.25s cubic-bezier(.2,.8,.3,1) forwards;
  white-space:nowrap;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,6px) scale(.6)}
  22%{opacity:1;transform:translate(-50%,-10px) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-72px) scale(1)}
}
.heart-fx{font-size:24px}
.confetti{position:absolute;font-size:18px;animation:fall 2.1s linear forwards;pointer-events:none}
@keyframes fall{
  0%{opacity:0;transform:translateY(-20px) rotate(0)}
  10%{opacity:1}
  100%{opacity:0;transform:translateY(300px) rotate(540deg)}
}

/* 效率气泡 */
.eff{
  position:absolute;top:14px;left:14px;z-index:3;
  background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.95);

/* ============ 开场动画 ============ */
/* 用 seedance 生成的 5 秒片段。为什么视频只做开场、不做常驻立绘：
   视频没有 alpha 通道，贴在草地上必须抠像，白毛绒玩偶逐帧抠会抖动；
   而开场是整屏播放、自带背景，正好用得上。
   造型靠"首帧=立绘合成到草地"锁死，所以画风和游戏一致。 */
.intro{
  position:fixed;inset:0;z-index:90;
  display:none;align-items:center;justify-content:center;
  background:#0d0f14;
}
/* 注意：这里**故意不做 opacity 动画**。
   iOS Safari 上，容器一旦有 opacity/transform 动画，子元素会被提成
   独立合成层，<video> 就可能停在合成时的那一帧不再刷新 ——
   表现正是"点了播放，画面卡在第一帧不动"。
   淡入效果不值得换这个 bug，所以直接显示。 */
.intro.on{display:flex}
/* 退场也改用 transition（不是 animation），同样是为了避开合成层问题 */
.intro{transition:opacity .55s ease}
.intro.out{opacity:0}
.intro video{
  width:100%;height:100%;object-fit:contain;
  display:block;
}
/* 跳过按钮：始终可见，但不用太抢眼 —— 大多数人会看完这 5 秒。
   注意**不要**在这里用 backdrop-filter。
   iOS Safari 有个已知问题：fixed 容器里的视频，上面再叠一个带
   backdrop-filter 的元素，会创建独立的合成层，视频就停止出帧 ——
   表现正是"点了播放，画面定在第一帧不动"。用半透明底色代替。 */
.intro .skip{
  position:absolute;right:14px;bottom:18px;
  padding:7px 15px;border-radius:999px;
  font-size:12px;font-weight:800;color:#fff;
  background:rgba(20,22,30,.62);
  border:1px solid rgba(255,255,255,.28);
  cursor:pointer;opacity:.85;transition:opacity .2s;
}
.intro .skip:hover{opacity:1}
/* 自动播放被拦时：提示用户点一下，同时把整屏变成可点区域 */
.intro.needtap{cursor:pointer}
.intro.needtap::after{
  content:'▶';
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:78px;height:78px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  padding-left:6px;font-size:30px;color:#fff;
  background:rgba(20,22,30,.62);
  border:2px solid rgba(255,255,255,.5);
  pointer-events:none;
}
@media(prefers-reduced-motion:reduce){
  /* 注意：这里**不能**写 .intro{display:none!important}。
     iOS 低电量模式会自动开启"减弱动态效果"，那样开场就被整个隐藏了，
     而 JS 那边（playIntro）在 REDUCED 下本来会改成"等一次点击再播" ——
     两边打架，结果就是手机上永远看不到开场。
     所以这里只关掉进出场动画，开场本身交给 JS 决定。 */
  .intro.on{animation:none}
  .intro.out{animation:none}
  .intro.needtap::after{animation:none}
}

<body>

<!-- 开场动画（seedance 生成，首帧由立绘合成到草地锁定造型）。

     注意 ?v=3：换视频时**必须**把这个号 +1，否则老访客会一直用缓存里的旧文件。

     视频有两个必须满足的约束，踩过一次各一次：

     1. faststart（moov 在文件开头）
        最初那版 moov 在 99.8% 的位置，浏览器得把整包下完才能开始播，
        表现就是"点了播放却定在第一帧"。
        ffmpeg -movflags +faststart

     2. 编码要对移动端友好
        原来那版是 H.264 **High** profile / 1112x834 / 5.3 Mbps。
        - High profile 在部分移动芯片上是软件解码，起播慢甚至不动
        - 1112x834 不是 16 的倍数，有些解码器会直接放弃
        - 5.3 Mbps 在蜂窝网络下要缓冲很久
        现在统一成 Main profile / 960x720 / 1.6 Mbps / 无音轨
        （视频本来就是静音的，那条 AAC 轨纯属浪费）。-->
<div class="intro" id="intro">
  <!-- webkit-playsinline 是 iOS 9 及更早版本的写法，现代浏览器忽略它。
       disablepictureinpicture / disableremoteplayback：避免 iOS 把视频

<script>
"use strict";
/* =========================================================

   单文件 / 零依赖 / localStorage 存档
   ========================================================= */

/* ---------------- 1. 角色数据 ---------------- */
/* 立绘来自 NICI 官网商品图（tools/make_sprites.py 抠底 + 归一化）。
   body/mane 等色值按实物取色，用于 UI 点缀（标签、飘字配色）。
   mouth / fur 由 tools/sample_fur.py 从立绘上实测而来 ——
   嘴型要随心情变，就得先用一块毛色补丁盖住原嘴再画新的，
   所以补丁色必须和立绘上的毛色一致，不然会看出一块疤。*/
const UNICORNS = [
  {
    id:'bubble', name:'泡泡', en:'Bubble',
    img:'assets/opt/unicorn_bubble.webp',
    tag:'经典款', tagColor:'#e87ba4',
    body:'#f7f2e7', bodyShade:'#e9e2d3', mane:'#e8628f', mane2:'#f4a3bd',
    accent:'#e8457a', hoof:'#f0dde4',
    mark:'star', bow:false,
    desc:'米白身体配亮粉鬃毛，身上绣着小星星。是这一系列里最经典的一只，也最容易被哄开心。',
    fav:'clover',            // 最爱三叶草
    bonus:{ happyDecay:-0.012 }
  },
  {
    id:'cloudy', name:'蓝宝', en:'Sky',
    img:'assets/opt/unicorn_cloudy.webp',
    tag:'清爽', tagColor:'#3ab4cc',
    body:'#f7f2e7', bodyShade:'#e9e2d3', mane:'#4cc5d9', mane2:'#7fddec',
    accent:'#2e9fb8', hoof:'#dceef2',
    mark:'rainbow', bow:false,
    desc:'米白身体配青蓝色鬃毛，身上有一道小彩虹。配色最清爽的一只，吃得多、长得快。',
    fav:'timothy',           // 最爱提摩西
    bonus:{ feedGain:1.12 }
  },
  {
    id:'peachy', name:'桃桃', en:'Peachy',
    img:'assets/opt/unicorn_peachy.webp',
    tag:'闪亮', tagColor:'#ef5f9c',
    body:'#f7a8c4', bodyShade:'#e88fb0', mane:'#ffffff', mane2:'#ffe3ef',
    accent:'#e0407f', hoof:'#f5c6d8',
    mark:'hex', bow:false,
    desc:'通体粉色亮片的撒糖款，配上雪白鬃毛。跑起来浑身闪，尾巴一甩就停不下来。',
    fav:'dandelion',         // 最爱蒲公英
    bonus:{ playGain:1.35 }
  },
  {
    id:'dreamy', name:'梦梦', en:'Dreamy',
    img:'assets/opt/unicorn_dreamy.webp',
    tag:'梦幻', tagColor:'#9aa4c8',
    body:'#8e9bb5', bodyShade:'#6f7c96', mane:'#f7c8dd', mane2:'#fde4ef',
    accent:'#e8609b', hoof:'#f2d9e6',
    mark:'gem', bow:false,
    desc:'深灰亮片配粉色鬃毛，像夜里的星空。陪它玩的时候，生长度涨得特别快。',
    fav:'alfalfa',           // 最爱苜蓿
    bonus:{ growthGain:1.2 }
  }
];
const byId = id => UNICORNS.find(u => u.id === id);

/* 素材版本号：更换立绘时 +1。
   立绘的文件名不变，不加这个参数的话，浏览器（和老访客）会一直用缓存的旧图。*/
const ASSET_V = 3;
const spriteUrl = u => `${u.img}?v=${ASSET_V}`;

/* ============ 心情表情 ============
   每只独角兽有 3 张表情图（assets/expr/<id>_<mood>.webp），
   由 tools/gen_expressions.py 用 musk-image 的改图端点生成 ——
   以当前立绘为参考图，只改嘴和眼神。

   为什么不用 CSS 叠加嘴型：先试过"毛色补丁盖住原嘴 + 画新弧线"，
   但补丁在照片级布偶上就是一块纯色圆斑（粉毛上像贴了创可贴），
   比直接生成难看太多，已放弃。

   分档和 MOODS 对齐：happy ≥70、calm ≥40、sad 其余。*/
const EXPR_TIERS = [['happy', 70], ['calm', 40], ['sad', 0]];
const exprMood  = h => (EXPR_TIERS.find(([, min]) => h >= min) || EXPR_TIERS[2])[0];
const exprUrl   = (u, mood) => `assets/expr/${u.id}_${mood}.webp?v=${ASSET_V}`;

let curExpr = null;   // 当前已应用的表情，用来避免每帧重设 img.src

/* 按心情切换立绘。
   只在档位真的变了才换 src —— 每帧重设会让图片闪一下、也白费流量。*/
function updateExpression(){
  const u = byId(S.chosen);
  const img = el.uniWrap.querySelector('.uni-img');
  if(!img || !u) return;
  const mood = exprMood(S.happy);
  if(curExpr === mood) return;
  curExpr = mood;
  img.src = exprUrl(u, mood);
}

/* 预加载三张表情，免得第一次切档时闪白。
   用 Image() 提前塞进浏览器缓存即可，不插进 DOM。*/
function preloadExpressions(u){
  for(const [mood] of EXPR_TIERS){
    const im = new Image();
    im.src = exprUrl(u, mood);
  }
}

/* ---------------- 2. 魔法礼品 ---------------- */
/* 礼品插画：assets/gifts_opt/*.webp（musk-image 生成 -> tools/gen_gifts.py
   -> tools/optimize_gifts.py 压缩）。e 字段保留 emoji 作为兜底。*/
const GIFTS = [
  {k:'clover',   e:'🍀', n:'四叶幸运草', r:0, w:17, d:'在一片三叶草里找到的唯一一片。据说把它夹进书里，那一天都会很顺利。'},
  {k:'cloud',    e:'☁️', n:'云朵棉花糖', r:0, w:16, d:'从最矮的那朵云上揪下来的一小块，咬一口会轻飘飘的。'},
  {k:'ribbon',   e:'🎀', n:'彩虹丝带', r:0, w:16, d:'系在鬃毛上，跑起来就会留下一条小彩虹。'},
  {k:'lollipop', e:'🍭', n:'魔法棒棒糖', r:0, w:15, d:'含在嘴里，吹出来的泡泡会变成星星的形状。'},
  {k:'carrot',   e:'🥕', n:'金胡萝卜', r:0, w:15, d:'比普通的草香一百倍。它闻到味道就会立刻跑过来。'},
  {k:'candle',   e:'🕯️', n:'月光蜡烛', r:0, w:12, d:'只在满月的夜里点燃，火光像被水洗过一样凉。'},
  {k:'crystal',  e:'🔮', n:'梦幻水晶球', r:1, w:9,  d:'摇一摇会下雪。雪里有一座很小很小的镇子，仔细看，里面也有一只独角兽。'},
  {k:'gem',      e:'💎', n:'独角兽宝石', r:1, w:8,  d:'从角的根部慢慢结出的结晶，握在手里是温的。'},
  {k:'rainbow',  e:'🌈', n:'迷你彩虹', r:1, w:7,  d:'可以折起来放进口袋。展开的时候，天上就真的会挂起一条。'},
  {k:'carousel', e:'🎠', n:'旋转木马模型', r:1, w:6,  d:'上好发条就会自己转圈，音乐是那种听了会想哭的老调子。'},
  {k:'crown',    e:'👑', n:'独角兽小王冠', r:2, w:3,  d:'戴上它的那一刻，整个小镇的草都会变甜。'},
  {k:'star',     e:'🌟', n:'永恒星光', r:2, w:2,  d:'从天上摘下来的一颗。它不会熄灭，你睡着的时候它会替你守着。'},
  {k:'golden',   e:'🦄', n:'黄金独角兽', r:2, w:1,  d:'传说中的身影。只有最耐心、最温柔的主人，才有机会见到它一次。'}
];
const giftImg = g => `assets/gifts_opt/${g.k}.webp?v=${ASSET_V}`;
const RARITY = ['普通','稀有','传说'];
const RARITY_CLASS = ['rb-0','rb-1','rb-2'];
const pickGift = () => {
  const total = GIFTS.reduce((s,g)=>s+g.w,0);
  let r = Math.random()*total;
  for (const g of GIFTS){ r -= g.w; if (r <= 0) return {...g}; }
  return {...GIFTS[0]};
};

/* ---------------- 3. 数值配置 ---------------- */
/* ============ 数值配置 ============
   当前是 **demo 档**：所有节奏都为"几分钟内演示完"服务。
   每项括号里是正常档取值，要恢复正式节奏照着改即可。

   demo 节奏目标：
     - 开心度/饱食度约 18 秒掉完（看得见进度条在动）
     - 喂 2~3 次草升一级
     - 抚摸/玩耍 1~2 秒就回一次，随便按

   注意：掉速和互动收益是**配套**的。掉速提上去后，
   抚摸 +18 只值 3 秒，按钮就形同虚设 —— 所以收益也要同比放大。*/
const CFG = {
  HAPPY_DECAY   : 5.5,     // 开心度每秒衰减，约 18 秒掉完 (正常 0.055)
  HUNGRY_EXTRA  : 3.5,     // 饿肚子时额外掉的开心度 (正常 0.045)
  HUNGRY_LINE   : 30,
  FULL_DECAY    : 5.5,     // 饱食度每秒衰减，约 18 秒掉完 (正常 0.05)
  CONTENT_HAPPY : 1.2,     // 吃饱时每秒回一点心情 (正常 0.012)
  CONTENT_LINE  : 78,

  /* 生长度**只靠喂草**（陪玩是小幅点缀），不做每秒自动累积 ——
     否则放着不管它也会自己升级，玩家没有参与感。
     (正常档喂一根草 +0.5) */
  FEED_GROWTH   : 50,      // 喂一根草的生长度（配合下面的上限 = 2~3 次升一级）
  PLAY_GROWTH   : 25,      // 陪玩一次的生长度（半根草的量）

  FEED_FULL     : 38,      // 一根草的饱食度 (正常 13)
  FEED_HAPPY_UP : 12,      // 喂草小幅加心情 (正常 3)
  PET_HAPPY     : 40,      // 抚摸的开心度（要顶得住 5.5/秒 的掉速）
  PLAY_HAPPY    : 55,      // 玩耍的开心度
  PLAY_FULL_COST: 14,      // 玩耍消耗的饱食度

  GRASS_START   : 30,      // (正常 12)
  GRASS_MAX     : 80,      // (正常 40)
  /* 注意：原来的 GRASS_EVERY（每 N 秒自动长一根草）已删除 ——
     草现在只能靠种田收，见下方的 SEEDS / FIELD。
     留着自动长草的话，种田就没有意义了。*/
  DAY_GRASS_GIFT: 6,       // 隔天赠送的**种子**（不是草）

  /* 抚摸/玩耍用**冷却恢复**，不是"每天限几次" ——
     几分钟的演示里，按天限制等于把按钮锁死。
     现在是：用完扣一次，之后每 N 秒回一次，补到上限为止。

/* 按舞台宽高比选布局。舞台接近方形/竖的时候用竖幅图，
   否则用横幅 —— 选比例更接近的那个，cover 裁切最少。*/
function pickFieldLayout(){
  const sw = el.stage.clientWidth, sh = el.stage.clientHeight;
  if(!(sw > 0 && sh > 0)) return fieldLayout;
  const stageAspect = sw / sh;
  let best = 'wide', bestD = Infinity;
  for(const [k, L] of Object.entries(FIELD_LAYOUTS)){
    const d = Math.abs(Math.log(stageAspect / L.aspect));
    if(d < bestD){ bestD = d; best = k; }
  }
  if(best !== fieldLayout){
    fieldLayout = best;
    fieldSig = '';           // 换了布局，田垄坐标全变了，必须重建
  }
  return fieldLayout;
}

/* 四边形 -> CSS 定位 + clip-path。
   先求包围盒（left/top/width/height），再用 clip-path 裁成梯形 ——
   这样点在梯形之外不会误触，比直接摆矩形准。*/
function bedStyle(quad){
  const xs = quad.map(p => p[0]), ys = quad.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = Math.max(0.01, x1 - x0), h = Math.max(0.01, y1 - y0);
  const clip = quad
    .map(([x, y]) => `${((x - x0) / w * 100).toFixed(2)}% ${((y - y0) / h * 100).toFixed(2)}%`)
    .join(', ');
  return `left:${x0.toFixed(2)}%;top:${y0.toFixed(2)}%;` +
         `width:${w.toFixed(2)}%;height:${h.toFixed(2)}%;` +
         `clip-path:polygon(${clip});`;
}

   Lv.1 是一只小崽，随等级一路长大，满级到 MAX。
   关键约束：**放大后不能超出舞台**，所以实际倍率还要被 scaleCap 夹一次
   （scaleCap 由 recomputeBounds 按舞台真实尺寸算出）。*/

  LEVELS: 18,

function levelScale(lv){
  const t = Math.min(Math.max((lv || 1) - 1, 0), GROW.LEVELS - 1) / (GROW.LEVELS - 1);
  return GROW.MIN + (GROW.MAX - GROW.MIN) * t;
}

/* ============ 存档开关 ============
   演示模式：**不记录进度**。每次打开或刷新都是从零开始的全新一局，
   不用担心中途留下的状态影响下一场演示。

   要恢复存档，把 PERSIST 改成 true 即可 —— save/load 的调用点都还在，
   不需要改动别处。

   注意 load() 也必须一起挡住：只让 save() 不写的话，
   之前留下的旧存档仍然会被读出来，等于没生效。*/
const PERSIST = false;

function load(){
  if(!PERSIST){
    // 顺手清掉之前留下的存档，避免它一直躺在 localStorage 里
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    return freshState();
  }
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return freshState();
    const o = JSON.parse(raw);
    const base = freshState();
    const s = Object.assign(base, o);
    // 老存档（用 daily 计数）迁移到新的冷却制字段上
    if(o.daily && !o.pet){
      s.pet  = Math.max(0, Math.min(CFG.PET_MAX,  o.daily.pet  ?? 0));
      s.play = Math.max(0, Math.min(CFG.PLAY_MAX, o.daily.play ?? 0));
    }
    delete s.daily;
    s.gifts = o.gifts || {};
    return s;
  }catch(e){ return freshState(); }
}

  if(!PERSIST) return;    // 演示模式：不落盘
  try{ S.lastTick = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}

function tone(freq, dur, type='sine', vol=.16, delay=0, slideTo=null){
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}

/* ---------------- 8.5 独角兽的自主行为与动画 ----------------
   走路/呼吸/弹跳全部由 JS 每帧合成成一条 transform，写进 .uni。
   不用 CSS 动画 —— 否则会和 JS 写的 transform 互相覆盖。*/
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ANIM = {
  x: 50,                 // 当前横向位置（舞台宽度的百分比）
  target: 50,
  dir: -1,               // -1 = 原图朝向（头朝左）；1 = 水平翻转（头朝右）
  moving: false,
  waitUntil: 0,          // 静止到什么时候再决定下一步
  breath: Math.random()*6.28,
  step: 0,               // 迈步相位
  act: null,             // 临时动作 {t, t0, dur, lockMove}
};
const WALK = {
  SPEED : 13,            // 每秒移动的舞台宽度百分比（状态好时的基准）
  PAUSE : [1500, 4200],  // 每次停下歇多久（毫秒）
  STEP_HZ: 8.5,          // 每秒迈步频率
  /* 状态不好时会变慢、变懒。系数下限不要压到 0 —— 那样它就完全不动了，
     看起来像卡住而不是"没精神"。 */
  SLOW_MIN: 0.32,
  PAUSE_MIN: 0.45,       // 停歇时间的倍率下限（越低歇得越久）
};

/* 状态 -> 走路速度倍率。
   越不开心、越饿，走得越慢、歇得越久。
   取两项里更差的那一个（而不是平均），这样"很饿但心情还行"也能看出来没力气。 */
function vigorFactor(happy, full){
  const h = Math.max(0, Math.min(1, happy / 100));
  const f = Math.max(0, Math.min(1, full / 100));
  const worst = Math.min(h, f);
  // 0.32（状态很差）→ 1.0（状态好）
  return WALK.SLOW_MIN + (1 - WALK.SLOW_MIN) * worst;
}
/* 可走范围按实际渲染尺寸算 —— 独角兽差不多占舞台宽的四成，
   若按固定的 15%~85% 走，靠边时会有一截伸出画面被 overflow 裁掉。
   抽成纯函数便于单独验证。 */
const BOUNDS = { min: 20, max: 80 };

function boundsFor(stageW, uniW, padPct=2){
  if(!(stageW > 0) || !(uniW > 0)) return null;   // 布局还没就绪
  const half = (uniW / 2 / stageW) * 100;
  const lo = half + padPct, hi = 100 - half - padPct;
  if(hi <= lo) return { min: 50, max: 50 };        // 极窄时退化为居中
  return { min: lo, max: hi };
}

function recomputeBounds(){
  const sw = el.stage.clientWidth, sh = el.stage.clientHeight;
  // offsetWidth/Height 是**布局**尺寸，不受 transform:scale 影响，
  // 所以它们就是 scale = 1.0 时的基准尺寸。
  const bw = el.uniWrap.offsetWidth, bh = el.uniWrap.offsetHeight;
  if(!(sw > 0) || !(bw > 0)) return false;

  /* 先算体型上限：`升到满级也不超出舞台`。
     这一步与等级无关，只取决于舞台和基准尺寸。 */
  if(sh > 0 && bh > 0){
    const byW = (sw * GROW.MAX_W_FRAC) / bw;
    const byH = (sh * GROW.MAX_H_FRAC) / bh;
    scaleCap = Math.max(0.3, Math.min(byW, byH));
  }

  /* 走动范围必须按**缩放后**的实际宽度算 ——
     否则等级升上去、体型变大之后，走到边缘会被 overflow 裁掉。 */
  const effScale = Math.min(levelScale(S && S.lv), scaleCap);
  const b = boundsFor(sw, bw * effScale);
  if(!b) return false;
  BOUNDS.min = b.min;
  BOUNDS.max = b.max;
  ANIM.x      = Math.max(b.min, Math.min(b.max, ANIM.x));
  ANIM.target = Math.max(b.min, Math.min(b.max, ANIM.target));
  return true;
}

addEventListener('resize', recomputeBounds);
// 布局尺寸可能在进入游戏后才稳定（图片加载、字体回流等），用观察器补算，
// 而不是赌某一时刻测到的宽度是对的。
if(window.ResizeObserver){
  new ResizeObserver(() => recomputeBounds()).observe(el.stage);
}
addEventListener('load', recomputeBounds);
const ACT_DUR = { hop:560, shake:620, cheer:1150, eat:1250 };

function resetAnim(){
  Object.assign(ANIM, {
    x:50, target:50, dir:-1, moving:false, waitUntil:performance.now()+900,
    step:0, act:null,
  });
}
/* 只清动作，**不动站位**。
   升级时要重建立绘（换表情/尺寸），但不能把它瞬移回画面中央 ——
   所以升级路径用这个，而不是 resetAnim。*/
function resetActOnly(){
  ANIM.act = null;
  ANIM.step = 0;
}
function uniAct(type, dur, lockMove=false){
  if(REDUCED) return;
  ANIM.act = { t:type, t0:performance.now(), dur: dur || ACT_DUR[type] || 600, lockMove };
}
/* 触发一个临时动作。action 见 ACT_DUR；lockMove 为真时动作期间站着不动 */
function popUni(type, dur){
  uniAct(type, dur, type === 'eat' || type === 'cheer');
}

function updateUni(now, dt){
  const g = el.uniWrap.querySelector('.uni');
  if(!g || !S || !S.chosen) return;
  const t = now / 1000;

  // ===== 1. 行走决策 =====
  if(ANIM.act && now >= ANIM.act.t0 + ANIM.act.dur) ANIM.act = null;
  const busy = !!(ANIM.act && ANIM.act.lockMove);   // 吃草/开心时站着别动

  if(!REDUCED && !busy){
    /* 状态不好就走得慢、歇得久。
       每帧按当前心情/饱食度算一次 —— 独角兽边走边掉数值，
       所以速度应该连续变化，而不是只在某个阈值上突然变。 */
    const vigor = vigorFactor(S.happy, S.full);

    if(ANIM.moving){
      const dx = ANIM.target - ANIM.x;
      const stepLen = WALK.SPEED * vigor * dt;
      if(Math.abs(dx) <= stepLen){
        ANIM.x = ANIM.target;
        ANIM.moving = false;
        // 没精神时歇得更久
        const pauseMul = WALK.PAUSE_MIN + (1 - WALK.PAUSE_MIN) * vigor;
        ANIM.waitUntil = now + (WALK.PAUSE[0] + Math.random()*(WALK.PAUSE[1]-WALK.PAUSE[0])) * pauseMul;
      }else{
        ANIM.x += Math.sign(dx) * stepLen;
        ANIM.step += dt * WALK.STEP_HZ * vigor;   // 步子也迈得慢
      }
      // 兜底夹紧：目标正常都取自 BOUNDS，但一旦有别的路径写进越界值，
      // 这里能保证它不会走出画面（宁可少走一点）
      ANIM.x = Math.max(BOUNDS.min, Math.min(BOUNDS.max, ANIM.x));
    }else if(now >= ANIM.waitUntil){
      // 有 35% 概率就地再歇一会儿，免得看着像机械巡逻
      if(Math.random() < 0.35){
        ANIM.waitUntil = now + 1200 + Math.random()*2000;
      }else{
        let tx = BOUNDS.min + Math.random()*(BOUNDS.max - BOUNDS.min);
        // 目标太近就往外挪，避免原地小幅抽搐
        if(Math.abs(tx - ANIM.x) < 18){
          const side = Math.random() < 0.5 ? -1 : 1;
          tx = ANIM.x + side * (18 + Math.random()*22);
        }
        ANIM.target = Math.max(BOUNDS.min, Math.min(BOUNDS.max, tx));
        ANIM.dir = ANIM.target < ANIM.x ? -1 : 1;
        ANIM.moving = true;
      }
    }
  }

  // ===== 2. 合成 transform =====
  /* 体型随等级长大：Lv.1 是小崽，满级到 GROW.MAX。
     再被 scaleCap 夹一次 —— 那是按舞台真实尺寸算出的上限，
     保证放大后不会超出画面（窗口很小的时候尤其重要）。*/
  const lvScale = Math.min(levelScale(S.lv), scaleCap);

  // 呼吸：一直都在，用独立的慢相位
  const breathe = REDUCED ? 0 : Math.sin(t*1.75 + ANIM.breath) * 3.2;

  // 迈步：上下颠 + 身体左右倾
  let bobY = 0, sway = 0;
  if(ANIM.moving){
    const s = Math.sin(ANIM.step);
    bobY = -Math.abs(s) * 5;
    sway = Math.sin(ANIM.step * 0.5) * 2.4;
  }

  // 临时动作叠加上去
  let actY = 0, actRot = 0, sx = 1, sy = 1;
  if(ANIM.act){
    const p = Math.min(1, (now - ANIM.act.t0) / ANIM.act.dur);
    const k = Math.sin(p * Math.PI);          // 0→1→0 的包络
    /* 动作幅度随状态缩放：不开心/饿的时候，弹跳和摇晃都变得软绵绵，
       显得无精打采。和走路用的是同一个 vigorFactor，行为才一致。
       下限 0.35 —— 再低动作就看不出来了，那是"卡住"不是"没精神"。
       注意：只缩**摆动**的部分，不缩姿势偏移（比如吃草时低头那 -3 度），
       否则它会连头都不肯低。*/
    const av = Math.max(0.35, vigorFactor(S.happy, S.full));
    switch(ANIM.act.t){
      case 'hop':                              // 喂草：轻轻一跳
        actY   = -Math.abs(Math.sin(p*Math.PI*2)) * 26 * av * (1 - p*0.35);
        sy     = 1 + k*0.06*av;
        sx     = 1 - k*0.05*av;
        break;
      case 'cheer':                            // 玩耍/收到礼物：连蹦带摇
        actY   = -Math.abs(Math.sin(p*Math.PI*4)) * 30 * av * (1 - p*0.25);
        actRot = Math.sin(p*Math.PI*6) * 7 * av;
        sy     = 1 + k*0.08*av;
        sx     = 1 - k*0.06*av;
        break;
      case 'shake':                            // 抚摸：左右蹭
        actRot = Math.sin(p*Math.PI*8) * 7 * av * (1 - p);
        break;
      case 'eat':                              // 吃草：低头点动
        // -3 是"低头"这个姿势本身，不缩放；后面的点动幅度才随状态变
        actRot = -3 + Math.sin(p*Math.PI*6) * 2.2 * av;
        actY   = 2 + Math.sin(p*Math.PI*6) * 1.5 * av;
        break;
    }
  }

  // 朝向：原画头朝左。向左走不翻转，向右走才翻转。
  // ANIM.dir 是**移动方向**（-1 左 / +1 右），而 scaleX 需要的是"朝向"，
  // 两者正好差一个负号 —— 早先直接把 dir 当 scaleX 用，导致它在倒着走。
  const facing = ANIM.moving ? -ANIM.dir : (ANIM.dir === 1 ? -1 : 1);

  g.style.transform =
    `translateY(${(breathe + bobY + actY).toFixed(2)}px) ` +
    `rotate(${(sway + actRot).toFixed(2)}deg) ` +
    `scale(${(lvScale * sx * facing).toFixed(4)}, ${(lvScale * sy).toFixed(4)})`;

  // ===== 3. 走位 =====
  el.uniWrap.style.left = ANIM.x.toFixed(2) + '%';
}

function flashBtn(btn){
  btn.classList.remove('recoil'); void btn.offsetWidth; btn.classList.add('recoil');
}

/* ---------------- 9. 选角界面 ---------------- */
function renderPick(){
  el.pickGrid.innerHTML = UNICORNS.map(u=>`
    <div class="card" data-id="${u.id}">
      <div class="pv"><img class="uni-img" src="${spriteUrl(u)}" alt="${u.name}" draggable="false"></div>
      <span class="tag" style="background:${u.tagColor}1f;color:${u.tagColor}">${u.tag}</span>
      <h3>${u.name}</h3>
      <p>${u.desc}</p>
      <div class="pick">选 择</div>
    </div>`).join('');
  el.pickGrid.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=>{
      SFX.click();
      const u = byId(c.dataset.id);
      chooseUnicorn(u.id);
    });
  });
}

/* ---------------- 10. 进入游戏 ---------------- */
function chooseUnicorn(id){
  S = S || freshState();
  S.chosen = id;
  S.bornAt = S.bornAt || Date.now();
  save();
  el.screenPick.classList.remove('on');
  el.screenGame.classList.add('on');
  el.menuName.textContent = byId(id).name;
  renderStable();
  recomputeBounds();        // 立绘尺寸确定后才知道可走范围有多宽
  checkDay(true);
  render();
  toast(`${byId(id).name} 来到你身边啦 💕`);
}

/* 重建立绘。
   keepPlace=true 时**保留当前站位**（升级就属于这种：体型长大，
   但应该留在原地长大，而不是闪现回画面中央）。*/
function renderStable(keepPlace=false){
  const u = byId(S.chosen);
  // 初始就按当前心情选表情，避免先显示"开心"再跳成"难过"
  curExpr = null;
  const mood = exprMood(S.happy);
  curExpr = mood;
  el.uniWrap.innerHTML =
    `<img class="uni uni-img" src="${exprUrl(u, mood)}" alt="${u.name}" draggable="false">`;
  preloadExpressions(u);   // 另外两张提前进缓存，切档时不闪
  // 等级缩放在 updateUni() 里合成进 transform 了，这里不要再设 scale，
  // 否则 CSS scale 会和 transform 的 scale() 叠乘，等级越高越离谱。
  if(keepPlace) resetActOnly(); else resetAnim();
}

/* ---------------- 11. 每日重置 ---------------- */
function checkDay(silent=false){
  const t = todayStr();
  if(S.lastDate === t) return false;
  const d1 = new Date(S.lastDate + 'T00:00:00');
  const d2 = new Date(t + 'T00:00:00');
  const passed = Math.max(1, Math.round((d2-d1)/86400000));
  S.day += passed;
  S.lastDate = t;
  // 新的一天：把互动次数补满（次数本身已经会随时间自动回补，
  // 这里是"过夜"额外给的一次满血）
  S.pet = CFG.PET_MAX; S.petT = 0;
  S.play = CFG.PLAY_MAX; S.playT = 0;
  /* 隔天补的是**种子**，不是草。
     草现在只能靠种田收（见 SEEDS / FIELD）—— 直接送草的话，
     等于有条捷径绕过田地，那套玩法就没意义了。
     四种各补几颗。*/
  const gift = CFG.DAY_GRASS_GIFT * Math.min(passed, 3);
  SEEDS.forEach(s => { S.seedBag[s.k] = (S.seedBag[s.k] || 0) + Math.ceil(gift / 4); });
  S.happy = Math.min(100, S.happy + 6);   // 见到主人，开心一点
  S.growth = Math.min(growthCap(S.lv), S.growth + 2);
  save();
  if(!silent){
    SFX.day();
    toast(`☀️ 第 ${S.day} 天！抚摸 +1，玩耍 +2，草地送来 ${CFG.DAY_GRASS_GIFT} 根草`);
    confetti(14);
  }
  return true;
}

/* ---------------- 12. 渲染 ---------------- */
const shown = {};   // 上一帧已写入的值，避免 60fps 重复写 DOM
function changed(key, val){
  if(shown[key] === val) return false;
  shown[key] = val;
  return true;
}
function setBar(key, fillEl, shineEl, numEl, val, cap){
  const pct = Math.max(0, Math.min(100, val/cap*100));
  if(changed(key+'_w', Math.round(pct*10))){
    fillEl.style.width  = `calc(${pct}% - 2px)`;
    shineEl.style.width = `calc(${pct}% - 2px)`;
  }
  const txt = Math.round(val) + (cap===100 ? '' : '/' + cap);
  if(changed(key+'_t', txt)) numEl.textContent = txt;
}
function moodOf(h){ return MOODS.find(m=>h>=m.min) || MOODS[MOODS.length-1]; }

function render(){
  if(!S || !S.chosen) return;
  const cap = growthCap(S.lv);

  setBar('happy',  el.fillHappy,  el.shHappy,  el.numHappy,  S.happy, 100);
  setBar('full',   el.fillFull,   el.shFull,   el.numFull,   S.full,  100);
  setBar('growth', el.fillGrowth, el.shGrowth, el.numGrowth, S.growth, cap);

  if(changed('hotH', S.happy >= 85))     el.numHappy.classList.toggle('hot', S.happy >= 85);
  if(changed('hotF', S.full >= 95))      el.numFull.classList.toggle('hot', S.full >= 95);
  if(changed('hotG', S.growth >= cap*.9))el.numGrowth.classList.toggle('hot', S.growth >= cap*.9);

  // 心情
  const m = moodOf(S.happy);
  updateExpression();   // 立绘换成对应心情的表情（内部已去重）
  if(changed('mood', m.t)){
    el.moodTxt.textContent = m.t;
    el.moodBox.firstChild.textContent = m.e + ' ';
    el.moodBox.style.background =
        S.happy >= 70 ? 'rgba(255,238,246,.94)'
      : S.happy >= 40 ? 'rgba(255,255,255,.9)'
      :                 'rgba(226,238,255,.94)';
  }

  // 效率
  const eff = feedEff(S.happy);
  const effKey = eff.toFixed(2);
  if(changed('eff', effKey)){
    el.effVal.textContent = '×' + effKey;
    el.effHint.textContent = eff >= 1.25 ? '它现在开心得不得了，吃得飞快！'
                          : eff >= 1.0  ? '心情不错，吃得挺香'
                          : eff >= 0.7  ? '心情一般，吃得慢吞吞'
                          : '心情低落，喂它也不太想吃…';
    el.effBox.querySelector('b').style.color = eff>=1.0 ? '#5fc48b' : (eff>=0.7 ? '#e8930c' : '#e0574a');
  }

  // 按钮
  const gainFull = CFG.FEED_FULL * eff * (byId(S.chosen).bonus.feedGain || 1);
  const noGrass  = S.grass <= 0, tooFull = S.full >= 99.5;

  if(changed('feedBtn', `${noGrass}|${tooFull}`)){
    el.btnFeed.disabled = noGrass || tooFull;
    el.subFeed.textContent = tooFull ? '已经吃饱' : `+${Math.round(gainFull)} 饱食`;
  }
  if(changed('grass', S.grass)){
    el.badgeGrass.textContent = S.grass;
    el.badgeGrass.classList.toggle('zero', noGrass);
  }

  /* 注意 key 里带上了倒计时秒数：次数为 0 时 S.pet 一直是 0 不会变，
     只拿 S.pet 做 key 的话"几秒后可以再摸"就永远停在初始值、不会往下走。 */
  const petLeft  = S.pet  > 0 ? 0 : Math.ceil(CFG.PET_REGEN  - S.petT);
  const playLeft = S.play > 0 ? 0 : Math.ceil(CFG.PLAY_REGEN - S.playT);

  if(changed('pet', S.pet + '|' + petLeft)){
    el.btnPet.disabled = S.pet <= 0;
    el.badgePet.textContent = S.pet;
    el.badgePet.classList.toggle('zero', S.pet <= 0);
    el.subPet.textContent = S.pet > 0 ? `+${petAmount()} 开心`
                                      : `${petLeft} 秒后可以再摸`;
  }
  if(changed('play', S.play + '|' + playLeft)){
    el.btnPlay.disabled = S.play <= 0;
    el.badgePlay.textContent = S.play;
    el.badgePlay.classList.toggle('zero', S.play <= 0);
    el.subPlay.textContent = S.play > 0 ? `+${playAmount()} 开心`
                                       : `${playLeft} 秒后可以再玩`;
  }

  // 顶部
  if(changed('day', S.day)) el.chipDay.textContent = `第 ${S.day} 天`;
  if(changed('lv', S.lv))   el.chipLv.textContent  = `Lv.${S.lv}`;
  const total = Object.values(S.gifts).reduce((a,b)=>a+b,0);
  if(changed('gifts', total)) el.chipGift.textContent = `🎁 ${total}`;
  if(changed('grassbar', Math.round(S.grass/CFG.GRASS_MAX*100)))
    el.grassFill.style.width = (S.grass/CFG.GRASS_MAX*100) + '%';
}
const petAmount  = () => Math.round(CFG.PET_HAPPY);
const playAmount = () => Math.round(CFG.PLAY_HAPPY * (byId(S.chosen).bonus.playGain || 1));

/* ============ 田地：种 / 收 ============
   草的唯一来源。每块地存 { k:种子key, at:种下的时间戳 }。

   为什么存绝对时间戳而不是倒计时：这样关掉页面再回来，
   草该长好就长好了 —— 玩家不用为了等草熟而一直开着游戏。*/
const plotReady = p => !!p && (Date.now() - p.at) >= seedOf(p.k).growMs;
const plotPct   = p => !p ? 0 : Math.min(1, (Date.now() - p.at) / seedOf(p.k).growMs);
const ripeCount = () => S.plots.filter(plotReady).length;

/* 种到第 i 块地。种子不够会拒绝。*/
function doPlant(i, seedKey){
  const seed = seedOf(seedKey);
  if(S.plots[i]) { toast('这块地已经种上啦'); return; }
  if((S.seedBag[seed.k] || 0) <= 0){ SFX.no(); toast(`${seed.n}的种子用完了 🌱`); return; }

  S.seedBag[seed.k]--;
  S.plots[i] = { k: seed.k, at: Date.now() };
  SFX.click(); buzz(10);
  closeModal(el.modalSeed);
  renderField();
  toast(`种下了${seed.n}，${Math.round(seed.growMs/1000)} 秒后就能收 🌱`);
}

/* 收第 i 块地。没熟会拒绝。*/
function doHarvest(i){
  const p = S.plots[i];
  if(!p) return;
  if(!plotReady(p)){ SFX.no(); toast('还没长好，再等一会儿 🌿'); return; }

  const seed = seedOf(p.k);
  // 种的是它最爱吃的草 -> 收成加成。四只各有口味，四种种籽才有区别。
  const fav  = byId(S.chosen).fav === seed.k;
  const got  = Math.round(seed.yield * (fav ? FIELD.FAV_BONUS : 1));

  S.grass = Math.min(CFG.GRASS_MAX, S.grass + got);
  /* 收完留种：不返还的话种子会用光（初始就 8 颗），
     而草又不再自己长，游戏就卡死了 —— 没草喂、也没种子再种。*/
  S.seedBag[seed.k] = (S.seedBag[seed.k] || 0) + FIELD.SEED_BACK;
  S.harvests++;
  S.plots[i] = null;
  SFX.feed(); buzz(14); burstHearts(fav ? 5 : 3);
  floaty(`🌿 +${got}`, 50, fav ? '#ff5c9d' : '#3a9e6a');
  if(fav) setTimeout(()=>floaty('它最爱吃这个！', 50, '#ff9d2e'), 260);
  renderField(); render();
  toast(fav ? `收了 ${got} 根${seed.n}（最爱吃 ×${FIELD.FAV_BONUS}）`
            : `收了 ${got} 根${seed.n}`);
}

/* 每当有地熟了就说一声 —— 但只在"刚变熟"的那一刻提醒一次，
   否则每帧都会弹。 */
let lastRipe = 0;
function checkRipe(){
  const n = ripeCount();
  if(n > lastRipe){
    SFX.full();
    toast(n === 1 ? '有草长好啦，去收 🌾' : `${n} 块地的草都长好啦 🌾`);
  }
  lastRipe = n;
}

/* ============ 田地的渲染 ============
   这里必须分成两件事，否则 hover 会一直闪：

   「结构」= 哪块地种了什么、熟没熟、换了哪只独角兽。
   「进度」= 作物长到多大了、还剩几秒。

   早先把进度也算进重建签名里，作物生长时每帧都不一样，
   于是 **DOM 每帧被重建一次**（实测 3 秒重建 21 次）。
   元素被替换后 :hover 状态自然中断，指针再进来又触发一次，
   表现就是"悬停时一直闪"。
   现在只在结构变化时重建，进度直接改进已有节点的 style。 */
function fieldStructSig(){
  return S.plots.map(p => !p ? '_' : `${p.k}:${plotReady(p) ? 'R' : 'G'}`).join('|')
       + `#${byId(S.chosen).id}`;
}
let fieldSig = '';

function renderField(){
  if(!S || !el.fieldBox) return;

  const ripe = ripeCount();

  // 田里有熟的就给木牌冒个绿点（不在田地场景时也要能看到）
  if(el.btnField) el.btnField.classList.toggle('hasRipe', ripe > 0);
  if(el.gateSub){
    const txt = ripe > 0 ? `${ripe} 块能收了！` : '去看看 ›';
    if(el.gateSub.textContent !== txt) el.gateSub.textContent = txt;
  }

  // 不在田地场景里就不用动 DOM
  if(el.stage.dataset.scene !== 'field') return;

  const sig = fieldStructSig();
  if(sig !== fieldSig){
    fieldSig = sig;
    buildField();
  }
  updateFieldProgress();     // 每帧都跑，但只改 style/文本，不碰结构
}

/* 重建田垄结构。只在种/收/成熟/换角色时调用。*/
/* 每块地的作物落点与尺寸。
   作物：水平居中于地块，垂直落在地块**中线**（用户要"往田地中间靠"），
         并从那里向上长。
   尺寸：按地块自身的宽高算，而不是写死百分比 ——
         横幅布局的田垄和竖屏 2x2 的田垄大小差很多，
         写死一个比例会让其中一种布局上的作物过大或过小。
   标签：同一行的地共用一条水平线，所以按行取底边。*/
function bedGround(i){
  const q = BEDS()[i];
  const xs = q.map(p => p[0]);
  const ys = q.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const cy = (y0 + y1) / 2;
  const bw = x1 - x0, bh = y1 - y0;
  return {
    cx: (x0 + x1) / 2,
    /* 作物根部略低于地块中线，向上生长 ——
       用户要"往田地中间靠一点"，但不能贴着地块底边（那样像掉在田垄外）。*/
    bottom: 100 - (cy + bh * 0.08),
    /* 尺寸跟着地块走：横幅布局的田垄和竖屏 2x2 的田垄差很多，
       写死百分比会让其中一种布局上的作物过大或过小。
       0.66 让作物基本待在地块内，只在顶部冒出一小截（看起来是长出来的）。*/
    hPct: bh * 0.66,
    wPct: bw * 0.34,
  };
}

/* 把地块按"底边高度接近"分组 —— 每组就是视觉上的一行。
   返回每块地所属行的底边（图片百分比）。*/
function rowBottoms(){
  const bots = BEDS().map(q => Math.max(...q.map(p => p[1])));
  return bots.map(b => {
    // 找同一行里最靠上的那个底边，作为整行统一的基准
    const sameRow = bots.filter(x => Math.abs(x - b) < 6);
    return Math.min(...sameRow);
  });
}

function buildField(){
  const u = byId(S.chosen);

  /* 三层 DOM 分开建，各管一件事：
       .bed   透明梯形热区（点击，clip-path 裁成梯形）
       .crop  作物（不能放进热区，否则会被梯形裁掉一截）
       .tag   标签（单独一层，才能按行统一对齐） */
  let beds = '', crops = '', tags = '';
  const rows = rowBottoms();

  S.plots.forEach((p, i) => {
    const style = bedStyle(BEDS()[i]);
    const { cx, cy, bottom, hPct, wPct } = bedGround(i);
    const glow  = `<span class="bedglow"></span>`;
    // 同一行的地，标签落在同一条水平线上
    const tagBottom = 100 - (rows[i] - 1.5);

    if(!p){
      beds += `<button class="bed" style="${style}" data-plant="${i}"
                       aria-label="第 ${i+1} 块空地，点击种下草籽">
        ${glow}
        <span class="plus">＋</span>
      </button>`;
      tags += `<span class="tag" data-tag="${i}"
                     style="left:${cx.toFixed(2)}%;bottom:${tagBottom.toFixed(2)}%">种点什么</span>`;
      return;
    }

    const seed   = seedOf(p.k);
    const isRipe = plotReady(p);
    const fav    = u && u.fav === seed.k;

    if(isRipe){
      const got = Math.round(seed.yield * (fav ? FIELD.FAV_BONUS : 1));
      beds += `<button class="bed ripe" style="${style}" data-harvest="${i}"
                       aria-label="收获${seed.n}">
        ${glow}
      </button>`;
      tags += `<span class="tag on ripe" data-tag="${i}"
                     style="left:${cx.toFixed(2)}%;bottom:${tagBottom.toFixed(2)}%">收 +${got}${fav ? ' 💖' : ''}</span>`;
    }else{
      beds += `<div class="bed" style="${style}">
        ${glow}
      </div>`;
      tags += `<span class="tag" data-tag="${i}"
                     style="left:${cx.toFixed(2)}%;bottom:${tagBottom.toFixed(2)}%">${seed.n}</span>`;
    }

    crops += `<img class="crop${isRipe ? ' ripe' : ''}"
                   src="assets/crops/${seed.k}.webp?v=${ASSET_V}"
                   alt="${seed.n}" draggable="false"
                   data-bed="${i}"
                   style="left:${cx.toFixed(2)}%;--ground:${bottom.toFixed(2)}%;--ch:${hPct.toFixed(1)}%;--cw:${wPct.toFixed(1)}%"
                   onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'crop pem',style:this.getAttribute('style'),textContent:'${seed.em}'}))">`;
  });

  el.fieldBox.innerHTML = beds + crops + tags;
}

/* 只更新进度：作物大小 + 倒计时文字。
   刻意不碰 innerHTML —— 一重建，hover 就断了。*/
function updateFieldProgress(){
  for(let i = 0; i < S.plots.length; i++){
    const p = S.plots[i];
    const crop = el.fieldBox.querySelector(`.crop[data-bed="${i}"]`);
    const tag  = el.fieldBox.querySelector(`.tag[data-tag="${i}"]`);
    if(!p || !crop) continue;

    const seed = seedOf(p.k);
    if(!plotReady(p)){
      const grow = 0.42 + 0.58 * plotPct(p);
      crop.style.transform = `scale(${grow.toFixed(3)})`;
      if(tag){
        const left = Math.max(0, Math.ceil((seed.growMs - (Date.now() - p.at)) / 1000));
        const txt = `${left} 秒`;
        if(tag.textContent !== txt) tag.textContent = txt;
      }
    }else{
      crop.style.transform = '';
    }
  }

  // 顶部提示条
  const ripe  = ripeCount();
  const empty = S.plots.filter(p => !p).length;
  const hint  = ripe > 0 ? `${ripe} 块可以收了！`
              : empty > 0 ? `${empty} 块空地可以种`
              : '都在长着，等一会儿就好';
  if(el.fieldHint.textContent !== hint) el.fieldHint.textContent = hint;
}

/* ---------------- 13. 动作 ---------------- */
function doFeed(){
  if(S.grass <= 0){ SFX.no(); flashBtn(el.btnFeed); toast('草用完啦，去小田地种一点 🌾'); return; }
  if(S.full >= 99.5){ SFX.no(); flashBtn(el.btnFeed); toast(`${byId(S.chosen).name} 已经吃不下了…`); return; }

  const u = byId(S.chosen);
  S.grass--;
  S.feeds++;
  const eff  = feedEff(S.happy);
  const gain = CFG.FEED_FULL * eff * (u.bonus.feedGain || 1);
  const before = S.full;
  S.full  = Math.min(100, S.full + gain);
  S.happy = Math.min(100, S.happy + CFG.FEED_HAPPY_UP);
  S.growth = Math.min(growthCap(S.lv), S.growth + CFG.FEED_GROWTH * (u.bonus.growthGain || 1));

  flashBtn(el.btnFeed);
  popUni('eat', 1250);     // 低头啃草（原画不能真张嘴，靠低头点动 + 时间暗示）
  SFX.feed(); buzz(10);

  const real = Math.round(S.full - before);
  floaty(`🌿 +${real}`, 36, '#3a9e6a');
  const col = eff >= 1.2 ? '#ff5c9d' : (eff >= 0.95 ? '#3a9e6a' : '#8a7a9e');
  floaty(`×${eff.toFixed(2)}`, 62, col);

  if(S.full >= 100){ setTimeout(()=>{ SFX.full(); burstHearts(4); floaty('😋 吃饱啦', 50, '#ff9d2e'); }, 420); }

  save(); render();
}

function doPet(){
  if(S.pet <= 0){ SFX.no(); flashBtn(el.btnPet); toast(`它还在回味呢，${Math.ceil(CFG.PET_REGEN - S.petT)} 秒后再来 🤚`); return; }
  const u = byId(S.chosen);
  S.pet--; S.pets++;
  const amt = petAmount();
  S.happy = Math.min(100, S.happy + amt);
  S.growth = Math.min(growthCap(S.lv), S.growth + CFG.PLAY_GROWTH * 0.5 * (u.bonus.growthGain || 1));

  flashBtn(el.btnPet);
  popUni('shake', 640);
  SFX.pet(); buzz(14);
  burstHearts(4);
  floaty(`💗 +${amt} 开心`, 48, '#ff5c9d');

  save(); render();
}

function doPlay(){
  if(S.play <= 0){ SFX.no(); flashBtn(el.btnPlay); toast(`它想歇一会儿，${Math.ceil(CFG.PLAY_REGEN - S.playT)} 秒后再玩 🎠`); return; }
  const u = byId(S.chosen);
  S.play--; S.plays++;
  const amt  = playAmount();
  const grow = CFG.PLAY_GROWTH * (u.bonus.growthGain || 1);
  S.happy  = Math.min(100, S.happy + amt);
  S.full   = Math.max(0,  S.full - CFG.PLAY_FULL_COST);
  S.growth = Math.min(growthCap(S.lv), S.growth + grow);

  flashBtn(el.btnPlay);
  popUni('cheer', 1150);   // 连蹦带摇
  SFX.play(); buzz(18);
  burstHearts(7);
  floaty(`🎠 +${amt} 开心`, 50, '#ff5c9d');
  setTimeout(()=>floaty(`✨ +${Math.round(grow)} 生长`, 30, '#5fc48b'), 220);
  setTimeout(()=>floaty(`🌿 -${CFG.PLAY_FULL_COST} 饱食`, 74, '#b09a6a'), 380);

  save(); render();
}

/* ---------------- 14. 生长度满 → 变礼物 ---------------- */
let pendingGifts = [];
function checkGrowth(){
  if(!S.chosen) return;
  const cap = growthCap(S.lv);
  if(S.growth < cap) return;

  S.growth -= cap;
  S.lv++;
  // 升级后体型变大，走动范围要跟着重算 —— 否则它还是按旧尺寸走，
  // 走到边缘会被 overflow 裁掉一截。
  recomputeBounds();
  const g = pickGift();
  S.gifts[g.n] = (S.gifts[g.n] || 0) + 1;
  S.giftTotal++;
  pendingGifts.push(g);

  /* 重建立绘时**保留站位** —— 升级的观感应该是"在原地长大"。
     若用 resetAnim（它会把 ANIM.x 设回 50），玩偶就会瞬移回画面中央，
     看起来像闪了一下。 */
  renderStable(true);
  popUni('cheer', 1150);   // 升级时长大了，先高兴一下
  confetti(30);
  SFX.gift(); buzz([22,60,22]);
  save();
  setTimeout(revealNext, 380);
}
function revealNext(){
  const g = pendingGifts.shift();
  if(!g) return;
  el.rvEm.innerHTML = `<img class="gimg-big" src="${giftImg(g)}" alt="${g.n}" draggable="false">`;
  el.rvName.textContent = g.n;
  el.rvDesc.textContent = g.d;
  el.rvRibbon.textContent = RARITY[g.r];
  el.rvRibbon.className = 'ribbon ' + RARITY_CLASS[g.r];
  openModal(el.modalReveal);
  el.rvOk.onclick = ()=>{
    closeModal(el.modalReveal);
    SFX.click();
    render();
    if(pendingGifts.length) setTimeout(revealNext, 260);
    else toast(`${byId(S.chosen).name} 长大啦！现在是 Lv.${S.lv} ✨`);
  };
}

/* ---- 田地：整屏换场景，不是弹窗 ---- */
/* 把场景图层按 cover 规则精确贴合舞台。
   —— 这一步是田垄能对齐的关键。
   舞台不能直接用 background（cover 会裁掉两侧，坐标系就错位了），
   所以放一张等比缩放的 <img>，再按图片尺寸算它的实际像素尺寸和偏移。
   田垄坐标是图片百分比，落在这一层上就永远对得准。*/
function layoutFieldScene(){
  const sc = $('fieldScene');
  if(!sc) return;

  // 先按舞台比例选布局（横幅/竖幅），再按所选图的宽高比算尺寸
  pickFieldLayout();
  const L = FIELD_LAYOUTS[fieldLayout];
  const img = sc.querySelector('.bg');
  if(img && !img.src.includes(L.src.split('?')[0])) img.src = L.src;

  const sw = el.stage.clientWidth, sh = el.stage.clientHeight;
  if(!(sw > 0 && sh > 0)) return;
  let w, h;
  /* cover 规则：取两个缩放比里**大**的那个，保证两个方向都铺满。
     舞台比图更"宽"（sw/sh 大于图片比例）时以宽度为准，
     否则以高度为准。这两条早先写反了，结果顶部露出一条空档。 */
  if(sw / sh >= L.aspect){         // 舞台更宽：宽度撑满，上下裁
    w = sw; h = sw / L.aspect;
  }else{                            // 舞台更高：高度撑满，左右裁
    h = sh; w = sh * L.aspect;
  }
  // 底部对齐（田垄在画面下半部，贴底最稳），水平居中
  sc.style.width  = w + 'px';
  sc.style.height = h + 'px';
  sc.style.left   = Math.round((sw - w) / 2) + 'px';
  sc.style.top    = Math.round(sh - h) + 'px';
}

/* ---------------- 17. 主循环 ---------------- */
let lastTime = performance.now();
function tick(now){
  const dt = Math.min(0.5, (now - lastTime)/1000);
  lastTime = now;

  if(S && S.chosen){
    checkDay();

    const u = byId(S.chosen);

    // 开心度衰减
    let hd = CFG.HAPPY_DECAY + (u.bonus.happyDecay || 0);
    if(S.full < CFG.HUNGRY_LINE) hd += CFG.HUNGRY_EXTRA * (1 - S.full/CFG.HUNGRY_LINE);
    S.happy = Math.max(0, Math.min(100, S.happy - hd*dt));
    if(S.full >= CFG.CONTENT_LINE) S.happy = Math.min(100, S.happy + CFG.CONTENT_HAPPY*dt);

    // 饱食度衰减
    S.full = Math.max(0, S.full - CFG.FULL_DECAY*dt);

    /* 生长度不在这里自动累积 —— 它只由喂草/陪玩推动（见 doFeed / doPlay）。
       早先写成每秒自动涨，结果放着不管也能升级，玩家反而没有参与感。 */

    /* 抚摸/玩耍的次数随时间回补。
       用独立计时器而不是"每天重置"：演示只有几分钟，
       按天重置等于把按钮锁死。 */
    if(S.pet < CFG.PET_MAX){
      S.petT += dt;
      if(S.petT >= CFG.PET_REGEN){ S.petT -= CFG.PET_REGEN; S.pet = Math.min(CFG.PET_MAX, S.pet + 1); }
    } else S.petT = 0;
    if(S.play < CFG.PLAY_MAX){
      S.playT += dt;
      if(S.playT >= CFG.PLAY_REGEN){ S.playT -= CFG.PLAY_REGEN; S.play = Math.min(CFG.PLAY_MAX, S.play + 1); }
    } else S.playT = 0;

    /* 草不再自己长 —— 唯一来源是种田（见 doPlant / doHarvest）。
       早先有"每 N 秒自动 +1 根"的兜底，现在去掉了：
       那样种田就没意义了，草会自己冒出来，玩家不用管。 */

    checkGrowth();
    /* 田地：熟了要提醒，进度条也得跟着走（田地在弹窗里，
       没打开时 renderField 会因签名没变而直接返回，开销可忽略）。*/
    checkRipe();
    renderField();
    updateUni(now, dt);
    render();
  }
  requestAnimationFrame(tick);
}

window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); else { checkDay(); lastTime = performance.now(); } });

/* ---------------- 18. 启动 ---------------- */

/* 播放开场动画。
   几个必须注意的点：
   1. 必须 muted —— 否则浏览器会以"未经用户交互"为由拒绝自动播放。
   2. 结束/跳过/出错三条路径都要能进入游戏，且**只能进一次**，
      用一个 done 标志兜住，避免 play 和 ended 重复触发。
   3. 加载失败不该把玩家挡在门外，直接跳过。
   4. 「减弱动态效果」下**不自动播**，但仍给一个点击播放的机会 ——
      不能整个跳过。iOS 低电量模式会自动打开这个偏好，
      早先写成"直接跳过"，结果手机上永远看不到开场。 */
function playIntro(onDone){
  let done = false, started = false, safety = null;
  const finish = ()=>{
    if(done) return;
    done = true;
    if(safety) clearTimeout(safety);
    try { sessionStorage.setItem('nici.intro', '1'); } catch(e){}
    el.intro.classList.add('out');
    setTimeout(()=>{
      el.intro.classList.remove('on','out','needtap');
      try { el.introVid.pause(); el.introVid.removeAttribute('src'); el.introVid.load(); } catch(e){}
      onDone();
    }, 560);
  };

  el.intro.classList.add('on');
  el.introSkip.addEventListener('click', finish, {once:true});
  el.introVid.addEventListener('error', finish, {once:true});

  /* 一旦真的开始播了，就撤掉兜底计时器 —— 让视频自然放完。
     早先固定 9 秒兜底：移动网络下视频常常还在缓冲就被跳过了。 */
  el.introVid.addEventListener('playing', ()=>{
    started = true;
    if(safety){ clearTimeout(safety); safety = null; }
    el.intro.classList.remove('needtap');
    el.introSkip.textContent = '跳过 ›';
  }, {once:true});

  /* 注意：这里**不要**再加"帧没刷新就判失败"的检测。
     试过用 requestVideoFrameCallback 判断画面是否在动，结果在一些浏览器上
     这个回调根本不触发（页面不可见、或实现不完整），于是视频正常播放时
     被误判成冻结、反复打回"点击播放"，反而更糟。*/

  /* iOS 上 play() 常在缓冲没到的时候被静默拒绝，
     之后也不会自己接着播 —— 表现就是"点了播放，画面停在第一帧"。
     所以这里盯着 play() 的结果：失败就退回"点击播放"状态，
     并把这次点击**记下来**，等 canplay 后自动补播一次。*/
  let wantPlay = false;

  const armFallback = (ms)=>{
    if(safety) clearTimeout(safety);
    safety = setTimeout(()=>{ if(!started) finish(); }, ms);
  };

  /* iOS 有个坑：HTML 上的 muted 属性在部分版本上不生效，
     play() 会因为"未经用户交互的有声播放"被拒绝，
     表现就是点了播放没反应。所以再用 JS 明确设一次。*/
  el.introVid.muted = true;
  el.introVid.defaultMuted = true;
  el.introVid.volume = 0;

  const doPlay = ()=>{
    wantPlay = true;
    const q = el.introVid.play();
    if(q && q.then){
      q.then(()=>{ wantPlay = false; })
       .catch(()=>{
          // 被拒绝：保持"点击播放"提示，等缓冲好了再试
          if(done) return;
          el.intro.classList.add('needtap');
          el.introSkip.textContent = '点击播放 ›';
       });
    }
  };

  /* 缓冲够了就补播（如果真的还在等着播）。
     canplay / loadeddata 都挂上：不同机型触发的时机不一样。*/
  const resumeIfWanted = ()=>{
    if(!wantPlay || done || started) return;
    if(el.introVid.readyState < 2) return;   // 还没到 HAVE_CURRENT_DATA
    const q = el.introVid.play();
    if(q && q.catch) q.catch(()=>{});
  };
  el.introVid.addEventListener('canplay', resumeIfWanted);
  el.introVid.addEventListener('loadeddata', resumeIfWanted);

  // 点击整屏开始播放（也用作"减弱动态效果"下的手动触发）
  const tapToPlay = ()=>{
    el.intro.classList.remove('needtap');
    el.introSkip.textContent = '跳过 ›';
    armFallback(15000);
    doPlay();
  };
  el.intro.addEventListener('click', ev=>{
    if(ev.target.closest('.skip')) return;   // 点"跳过"就跳过，别再播一遍
    tapToPlay();
  });

  if(REDUCED){
    /* 尊重"减弱动态效果"：不自动播放，改为等一次点击。
       这样既没有不请自来的动画，玩家又不会错过开场。 */
    el.intro.classList.add('needtap');
    el.introSkip.textContent = '点击播放 ›';
    armFallback(12000);      // 一直不点就走人
  }else{
    el.introVid.preload = 'auto';
    armFallback(12000);
    doPlay();
  }
}

(function boot(){
  S = load();
  renderPick();

  /* 开场动画：只在**本会话第一次**进游戏时放一次。
     用 sessionStorage 而不是 localStorage —— 刷新页面不该重放，
     但关掉标签页重开时再看一遍是合理的（这是"故事的开头"）。 */
  let playedIntro = false;
  try { playedIntro = sessionStorage.getItem('nici.intro') === '1'; } catch(e){}

  function startGame(){
    const savedId = S.chosen && (typeof S.chosen === 'string' ? S.chosen : S.chosen.id);
    if(savedId && byId(savedId)){
      chooseUnicorn(savedId);      // 有存档：直接回到牧场
    }else{
      S.chosen = null;
      el.screenPick.classList.add('on');
    }
    lastTime = performance.now();
    requestAnimationFrame(tick);
  }

  // 注意：这里**不**因 REDUCED 跳过开场 —— 那种情况下 playIntro 内部
  // 会改成"等一次点击再播"。整个跳过会导致 iOS 低电量模式（会自动开启
  // 减弱动态效果）下永远看不到开场。
  if(playedIntro || !el.intro){
    startGame();
  }else{
    playIntro(startGame);
  }
})();
</script>
